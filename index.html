<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paty-XRT — Настольная игра</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2a1e3f);
    color: white; text-align: center; margin: 0; padding: 20px;
    min-height: 100vh;
  }
  h1 { color: #ffcc00; margin: 0 0 10px; }
  
  /* Стартовый экран */
  #startScreen {
    max-width: 500px; margin: 60px auto;
    background: rgba(255,255,255,0.05);
    padding: 30px; border-radius: 20px;
    border: 2px solid #ffcc00;
  }
  #startScreen h2 { color: #ffcc00; }
  .player-btn {
    display: inline-block; padding: 15px 30px; margin: 8px;
    background: #2e2e4f; border: 2px solid #555;
    color: white; border-radius: 10px; font-size: 18px;
    cursor: pointer; transition: all 0.2s;
  }
  .player-btn:hover { border-color: #ffcc00; transform: scale(1.05); }
  .player-btn.selected { background: #ffcc00; color: #1e1e2f; border-color: #ffcc00; }
  .start-go {
    margin-top: 20px; padding: 15px 50px;
    background: #ffcc00; color: #1e1e2f; border: none;
    border-radius: 10px; font-size: 20px; font-weight: bold;
    cursor: pointer;
  }
  .start-go:disabled { opacity: 0.4; cursor: not-allowed; }
  
  /* Игровой экран */
  #gameScreen { display: none; }
  #scoreboard {
    display: flex; justify-content: center; gap: 20px;
    margin: 15px 0; flex-wrap: wrap;
  }
  .score-card {
    padding: 10px 20px; border-radius: 10px;
    background: #2e2e4f; border: 2px solid #555;
    min-width: 120px;
  }
  .score-card.active { border-color: #ffcc00; box-shadow: 0 0 15px #ffcc00; }
  .score-card .name { font-weight: bold; font-size: 16px; }
  .score-card .pts { font-size: 24px; color: #ffcc00; }
  
  #turnInfo { font-size: 20px; margin: 10px 0; }
  
  #board {
    display: grid;
    grid-template-columns: repeat(5, 100px);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
  }
  .cell {
    width: 100px; height: 100px;
    background: #2e2e4f;
    border: 2px solid #555;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 12px; position: relative;
    transition: all 0.3s;
  }
  .cell.active { border-color: #ffcc00; box-shadow: 0 0 20px #ffcc00; }
  .cell .num { position: absolute; top: 4px; left: 6px; font-size: 11px; opacity: 0.5; }
  .cell .icon { font-size: 30px; }
  .cell.type-sound { background: #3a2e4f; border-color: #a066ff; }
  .cell.type-draw { background: #2e4a3f; border-color: #4dff88; }
  .cell.type-fort { background: #4a3a2e; border-color: #ffa64d; }
  .cell.type-guess { background: #4a2e3a; border-color: #ff4d9f; }
  
  .player {
    width: 22px; height: 22px;
    border-radius: 50%;
    position: absolute; bottom: 4px;
    border: 2px solid rgba(255,255,255,0.6);
    transition: all 0.3s;
  }
  .p1 { background: #ff4d4d; left: 6px; }
  .p2 { background: #4d9fff; right: 6px; }
  .p3 { background: #4dff88; left: 6px; bottom: 30px; }
  .p4 { background: #ffcc00; right: 6px; bottom: 30px; }
  
  #controls { margin-top: 15px; }
  #rollBtn {
    padding: 15px 40px; font-size: 20px;
    background: #ffcc00; color: #1e1e2f;
    border: none; border-radius: 10px; font-weight: bold;
    cursor: pointer;
  }
  #rollBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #diceResult { font-size: 20px; margin-top: 10px; color: #ffcc00; }
  
  /* Попап задания */
  #taskModal {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center; justify-content: center;
  }
  #taskModal.show { display: flex; }
  .task-box {
    background: #2a2a45; border: 3px solid #ffcc00;
    border-radius: 20px; padding: 30px;
    max-width: 500px; width: 90%;
    text-align: center;
  }
  .task-box .task-icon { font-size: 60px; }
  .task-box h2 { color: #ffcc00; margin: 10px 0; }
  .task-box .task-text { font-size: 18px; margin: 20px 0; line-height: 1.4; }
  .task-box .timer {
    font-size: 48px; font-weight: bold; color: #ff4d4d;
    margin: 15px 0;
  }
  .task-box .timer.ok { color: #4dff88; }
  .task-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
  .task-buttons button {
    padding: 12px 25px; font-size: 16px;
    border: none; border-radius: 10px; font-weight: bold;
    cursor: pointer;
  }
  .btn-done { background: #4dff88; color: #1e1e2f; }
  .btn-fail { background: #ff4d4d; color: white; }
  .btn-close { background: #555; color: white; }
  
  #finishModal {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    z-index: 200;
    align-items: center; justify-content: center;
  }
  #finishModal.show { display: flex; }
  .finish-box {
    background: #2a2a45; border: 3px solid #ffcc00;
    border-radius: 20px; padding: 40px;
    max-width: 500px; width: 90%; text-align: center;
  }
  .finish-box h2 { color: #ffcc00; font-size: 32px; }
  .finish-box ol { text-align: left; font-size: 20px; line-height: 1.8; }
  .finish-box button {
    margin-top: 20px; padding: 15px 40px;
    background: #ffcc00; color: #1e1e2f;
    border: none; border-radius: 10px;
    font-size: 18px; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>

<!-- ========= СТАРТОВЫЙ ЭКРАН ========= -->
<div id="startScreen">
  <h1>🎲 Paty-XRT</h1>
  <h2>Сколько игроков?</h2>
  <div id="playerChoice">
    <button class="player-btn" data-count="2">👥 2 игрока</button>
    <button class="player-btn" data-count="3">👥 3 игрока</button>
    <button class="player-btn" data-count="4">👥 4 игрока</button>
  </div>
  <br>
  <button class="start-go" id="startBtn" disabled>Начать игру</button>
  <p style="opacity:0.6;font-size:14px;margin-top:20px;">
    🎤 звук · 🎨 рисунок · 🏰 крепость · 🕵️ угадай
  </p>
</div>

<!-- ========= ИГРОВОЙ ЭКРАН ========= -->
<div id="gameScreen">
  <h1>🎲 Paty-XRT</h1>
  <div id="scoreboard"></div>
  <div id="turnInfo">Ход игрока: <span id="turnName">—</span></div>
  
  <div id="board"></div>
  
  <div id="controls">
    <button id="rollBtn" onclick="rollDice()">Бросить кубик</button>
    <div id="diceResult">—</div>
  </div>
</div>

<!-- ========= ПОПАП ЗАДАНИЯ ========= -->
<div id="taskModal">
  <div class="task-box">
    <div class="task-icon" id="taskIcon">🎤</div>
    <h2 id="taskTitle">Задание</h2>
    <div class="task-text" id="taskText">—</div>
    <div class="timer" id="taskTimer">90</div>
    <div class="task-buttons">
      <button class="btn-fail" onclick="finishTask(false)">❌ Провал</button>
      <button class="btn-done" onclick="finishTask(true)">✅ Выполнено (+2)</button>
    </div>
  </div>
</div>

<!-- ========= ФИНАЛЬНЫЙ ЭКРАН ========= -->
<div id="finishModal">
  <div class="finish-box">
    <h2>🏆 Игра окончена!</h2>
    <ol id="finalScores"></ol>
    <button onclick="location.reload()">Играть снова</button>
  </div>
</div>

<script>
// ==================== ДАННЫЕ ====================
const COLORS = {
  1: { name: 'Красный', css: '#ff4d4d' },
  2: { name: 'Синий',   css: '#4d9fff' },
  3: { name: 'Зелёный', css: '#4dff88' },
  4: { name: 'Жёлтый',  css: '#ffcc00' }
};

const CELL_TYPES = [
  'normal','normal','sound','normal','draw',
  'normal','fort','normal','normal','guess',
  'sound','normal','draw','normal','fort'
];

const TASKS = {
  sound: {
    icon: '🎤', title: 'Повтори звук',
    text: 'Слушай звук, который издаёт сосед справа. Повтори его как можно точнее!'
  },
  draw: {
    icon: '🎨', title: 'Нарисуй друга',
    text: 'У тебя 90 секунд, чтобы нарисовать любого игрока за столом. Остальные угадывают, кто это.'
  },
  fort: {
    icon: '🏰', title: 'Построй крепость',
    text: 'Из подручных предметов (или на бумаге) построй крепость за 90 секунд. Остальные оценивают.'
  },
  guess: {
    icon: '🕵️', title: 'Угадай кто',
    text: 'Опиши одного из игроков словами (не называя имени). Остальные должны угадать, кто это.'
  }
};

const TOTAL_CELLS = 15;

// ==================== СОСТОЯНИЕ ИГРЫ ====================
let playerCount = 0;
let players = [];
let currentPlayerIndex = 0;
let isMoving = false;
let timerInterval = null;
let currentTaskBonus = false;

// ==================== СТАРТОВЫЙ ЭКРАН ====================
document.querySelectorAll('.player-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    playerCount = parseInt(btn.dataset.count);
    document.getElementById('startBtn').disabled = false;
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  
  // Создаём игроков
  players = [];
  for (let i = 1; i <= playerCount; i++) {
    players.push({ id: i, name: COLORS[i].name, color: COLORS[i].css, pos: 0, score: 0 });
  }
  currentPlayerIndex = 0;
  
  buildBoard();
  updateScoreboard();
  updateTurn();
}

// ==================== ИГРОВОЕ ПОЛЕ ====================
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  
  for (let i = 0; i < TOTAL_CELLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell type-' + CELL_TYPES[i];
    cell.id = 'cell-' + i;
    
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = i + 1;
    cell.appendChild(num);
    
    // Иконка для особых клеток
    if (CELL_TYPES[i] !== 'normal') {
      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = TASKS[CELL_TYPES[i]].icon;
      cell.appendChild(icon);
    }
    
    board.appendChild(cell);
  }
  
  // Расставляем фишки в первую клетку
  const firstCell = document.getElementById('cell-0');
  players.forEach(p => {
    const piece = document.createElement('div');
    piece.className = 'player p' + p.id;
    piece.id = 'piece-' + p.id;
    firstCell.appendChild(piece);
  });
  
  highlightCell(0);
}

function highlightCell(index) {
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
  const cell = document.getElementById('cell-' + index);
  if (cell) cell.classList.add('active');
}

function updateScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  players.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'score-card' + (idx === currentPlayerIndex ? ' active' : '');
    card.style.borderColor = idx === currentPlayerIndex ? '#ffcc00' : p.color;
    card.innerHTML = `<div class="name" style="color:${p.color}">${p.name}</div>
                      <div class="pts">${p.score}</div>`;
    sb.appendChild(card);
  });
}

function updateTurn() {
  const p = players[currentPlayerIndex];
  const el = document.getElementById('turnName');
  el.textContent = p.name;
  el.style.color = p.color;
  updateScoreboard();
}

// ==================== БРОСОК КУБИКА ====================
function rollDice() {
  if (isMoving) return;
  isMoving = true;
  document.getElementById('rollBtn').disabled = true;
  
  const dice = Math.floor(Math.random() * 6) + 1;
  document.getElementById('diceResult').textContent = 'Выпало: ' + dice;
  
  const player = players[currentPlayerIndex];
  const target = Math.min(player.pos + dice, TOTAL_CELLS - 1);
  
  const interval = setInterval(() => {
    if (player.pos < target) {
      player.pos++;
      movePiece(player.id, player.pos);
      highlightCell(player.pos);
    } else {
      clearInterval(interval);
      isMoving = false;
      
      // Проверяем, на какую клетку попали
      const cellType = CELL_TYPES[player.pos];
      
      if (player.pos === TOTAL_CELLS - 1) {
        // Финиш
        player.score += 5; // бонус за финиш
        updateScoreboard();
        setTimeout(() => showFinish(), 500);
      } else if (cellType !== 'normal') {
        // Особая клетка — показываем задание
        setTimeout(() => showTask(cellType), 400);
      } else {
        // Обычная — просто передаём ход
        setTimeout(nextTurn, 600);
      }
    }
  }, 180);
}

function movePiece(playerId, cellIndex) {
  const piece = document.getElementById('piece-' + playerId);
  const target = document.getElementById('cell-' + cellIndex);
  if (piece && target) target.appendChild(piece);
}

function nextTurn() {
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateTurn();
  document.getElementById('rollBtn').disabled = false;
  document.getElementById('diceResult').textContent = '—';
}

// ==================== ЗАДАНИЯ ====================
function showTask(type) {
  const task = TASKS[type];
  document.getElementById('taskIcon').textContent = task.icon;
  document.getElementById('taskTitle').textContent = task.title;
  document.getElementById('taskText').textContent = task.text;
  document.getElementById('taskModal').classList.add('show');
  
  // Таймер 90 секунд
  let timeLeft = 90;
  const timerEl = document.getElementById('taskTimer');
  timerEl.textContent = timeLeft;
  timerEl.classList.remove('ok');
  
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 10) timerEl.classList.add('ok');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerEl.textContent = '0';
    }
  }, 1000);
}

function finishTask(success) {
  clearInterval(timerInterval);
  document.getElementById('taskModal').classList.remove('show');
  
  if (success) {
    players[currentPlayerIndex].score += 2;
    updateScoreboard();
  }
  
  setTimeout(nextTurn, 400);
}

// ==================== ФИНАЛ ====================
function showFinish() {
  // Сортируем по очкам
  const sorted = [...players].sort((a, b) => b.score - a.score);
  const list = document.getElementById('finalScores');
  list.innerHTML = '';
  sorted.forEach(p => {
    const li = document.createElement('li');
    li.innerHTML = `<span style="color:${p.color};font-weight:bold">${p.name}</span> — ${p.score} очков`;
    list.appendChild(li);
  });
  document.getElementById('finishModal').classList.add('show');
}
</script>

</body>
</html>
